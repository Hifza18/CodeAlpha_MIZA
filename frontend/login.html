<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Login - ZEVORA</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<header>
    <h1>🛒 ZEVORA</h1>
</header>

<main>

    <div class="product-card">

        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <br><br>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <br><br>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

        <p>
            <a href="index.html">← Back to ZEVORA</a>
        </p>

    </div>

</main>

<script src="login.js"></script>


</body>

</html>
