<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Orders | ZEVORA</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f6f8;

            color: #222;
        }


        /* ==============================
           HEADER
        ============================== */

        header {

            background: #131921;

            color: white;

            padding: 18px 35px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .logo {

            font-size: 23px;

            font-weight: bold;
        }


        .back-button {

            color: white;

            text-decoration: none;

            border: 1px solid #66717d;

            padding: 9px 15px;

            border-radius: 5px;

            font-size: 14px;
        }


        .back-button:hover {

            background: #263445;
        }


        /* ==============================
           MAIN
        ============================== */

        main {

            max-width: 1100px;

            margin: auto;

            padding: 35px 20px;
        }


        .page-title {

            margin-bottom: 25px;
        }


        .page-title h1 {

            font-size: 30px;

            margin-bottom: 7px;
        }


        .page-title p {

            color: #6b7280;

            font-size: 14px;
        }


        /* ==============================
           MESSAGE
        ============================== */

        #message {

            text-align: center;

            font-weight: bold;

            margin-bottom: 20px;
        }


        /* ==============================
           ORDER CARD
        ============================== */

        .order-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            margin-bottom: 20px;

            overflow: hidden;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.05);
        }


        /* ==============================
           ORDER HEADER
        ============================== */

        .order-header {

            background: #f9fafb;

            padding: 18px 22px;

            border-bottom: 1px solid #e5e7eb;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;
        }


        .order-number {

            font-weight: bold;

            font-size: 17px;
        }


        .order-user {

            color: #6b7280;

            font-size: 13px;

            margin-top: 5px;
        }


        /* ==============================
           ORDER BODY
        ============================== */

        .order-body {

            padding: 20px 22px;
        }


        .order-date {

            color: #6b7280;

            font-size: 13px;

            margin-bottom: 18px;
        }


        .items-title {

            font-weight: bold;

            margin-bottom: 12px;
        }


        .order-item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 12px 0;

            border-bottom: 1px solid #eeeeee;
        }


        .item-name {

            font-weight: 600;
        }


        .item-details {

            color: #6b7280;

            font-size: 13px;

            margin-top: 5px;
        }


        .subtotal {

            font-weight: bold;
        }


        /* ==============================
           FOOTER
        ============================== */

        .order-footer {

            border-top: 1px solid #e5e7eb;

            padding: 18px 22px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .total {

            font-size: 20px;

            font-weight: bold;
        }


        /* ==============================
           STATUS
        ============================== */

        .status-section {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .status-section label {

            font-size: 14px;

            font-weight: bold;
        }


        .status-select {

            padding: 8px 10px;

            border: 1px solid #ccc;

            border-radius: 5px;

            background: white;

            cursor: pointer;
        }


        .update-button {

            padding: 8px 14px;

            border: none;

            border-radius: 5px;

            background: #131921;

            color: white;

            cursor: pointer;

            font-weight: bold;
        }


        .update-button:hover {

            background: #263445;
        }


        /* ==============================
           EMPTY
        ============================== */

        .empty-orders {

            background: white;

            padding: 60px 20px;

            text-align: center;

            border-radius: 10px;

            border: 1px solid #e5e7eb;
        }


        .empty-orders h2 {

            margin-bottom: 10px;
        }


        .empty-orders p {

            color: #6b7280;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 650px) {

            header {

                padding: 15px 20px;
            }


            .logo {

                font-size: 19px;
            }


            main {

                padding: 25px 15px;
            }


            .order-header {

                flex-direction: column;

                align-items: flex-start;
            }


            .order-footer {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }


            .status-section {

                flex-wrap: wrap;
            }

        }

    </style>

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header>

    <div class="logo">

        🛍️ ZEVORA Admin

    </div>


    <a
        href="admin.html"
        class="back-button"
    >

        ← Dashboard

    </a>

</header>



<!-- =====================================
     MAIN
===================================== -->

<main>


    <div class="page-title">

        <h1>
            Manage Orders
        </h1>

        <p>
            View customer orders and update their status.
        </p>

    </div>


    <div id="message"></div>


    <div id="ordersContainer">

        Loading orders...

    </div>


</main>



<script>


// =====================================
// API
// =====================================

const API_URL =
    "https://MIZAH-no6r.onrender.com/api/orders";


// =====================================
// ELEMENTS
// =====================================

const ordersContainer =
    document.getElementById(
        "ordersContainer"
    );


const message =
    document.getElementById(
        "message"
    );


// =====================================
// LOAD ALL ORDERS
// =====================================

async function loadOrders() {

    try {

        const response =
            await fetch(
                `${API_URL}/admin/all`
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load orders"
            );

        }


        const orders =
            await response.json();


        // =================================
        // NO ORDERS
        // =================================

        if (orders.length === 0) {

            ordersContainer.innerHTML = `

                <div class="empty-orders">

                    <h2>
                        📦 No orders yet
                    </h2>

                    <p>
                        Customer orders will appear here.
                    </p>

                </div>

            `;

            return;
        }


        ordersContainer.innerHTML = "";


        // =================================
        // DISPLAY ORDERS
        // =================================

        orders.forEach(order => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "order-card";


            const date =
                order.created_at
                    ? new Date(
                        order.created_at
                      ).toLocaleString()
                    : "Unknown";


            const total =
                Number(
                    order.total_amount
                ) || 0;


            const currentStatus =
                order.status ||
                "pending";


            // =================================
            // ITEMS
            // =================================

            let itemsHTML = "";


            if (
                order.items &&
                order.items.length > 0
            ) {

                itemsHTML =
                    order.items.map(item => {


                        const price =
                            Number(
                                item.price
                            ) || 0;


                        const quantity =
                            Number(
                                item.quantity
                            ) || 0;


                        const subtotal =
                            price *
                            quantity;


                        return `

                            <div class="order-item">

                                <div>

                                    <div class="item-name">

                                        ${item.name}

                                    </div>


                                    <div class="item-details">

                                        Quantity:
                                        ${quantity}

                                        &nbsp; | &nbsp;

                                        Price:
                                        ₹${price.toFixed(2)}

                                    </div>

                                </div>


                                <div class="subtotal">

                                    ₹${subtotal.toFixed(2)}

                                </div>

                            </div>

                        `;

                    }).join("");

            } else {

                itemsHTML =
                    "<p>No items found.</p>";

            }


            // =================================
            // CARD
            // =================================

            card.innerHTML = `

                <div class="order-header">

                    <div>

                        <div class="order-number">

                            Order #${order.id}

                        </div>


                        <div class="order-user">

                            Customer ID:
                            ${order.user_id}

                        </div>

                    </div>

                </div>


                <div class="order-body">


                    <div class="order-date">

                        📅 ${date}

                    </div>


                    <div class="items-title">

                        Order Items

                    </div>


                    ${itemsHTML}


                </div>


                <div class="order-footer">


                    <div class="total">

                        Total:
                        ₹${total.toFixed(2)}

                    </div>


                    <div class="status-section">

                        <label>

                            Status:

                        </label>


                        <select
                            class="status-select"
                            id="status-${order.id}"
                        >

                            <option
                                value="pending"
                                ${currentStatus === "pending" ? "selected" : ""}
                            >
                                Pending
                            </option>


                            <option
                                value="confirmed"
                                ${currentStatus === "confirmed" ? "selected" : ""}
                            >
                                Confirmed
                            </option>


                            <option
                                value="shipped"
                                ${currentStatus === "shipped" ? "selected" : ""}
                            >
                                Shipped
                            </option>


                            <option
                                value="delivered"
                                ${currentStatus === "delivered" ? "selected" : ""}
                            >
                                Delivered
                            </option>


                            <option
                                value="cancelled"
                                ${currentStatus === "cancelled" ? "selected" : ""}
                            >
                                Cancelled
                            </option>

                        </select>


                        <button
                            class="update-button"
                            onclick="updateStatus(${order.id})"
                        >

                            Update

                        </button>

                    </div>

                </div>

            `;


            ordersContainer.appendChild(
                card
            );

        });


    } catch (error) {

        console.error(
            "Admin orders error:",
            error
        );


        message.textContent =
            "Unable to load orders.";

    }

}


// =====================================
// UPDATE STATUS
// =====================================

async function updateStatus(orderId) {


    const select =
        document.getElementById(
            `status-${orderId}`
        );


    const status =
        select.value;


    try {

        const response =
            await fetch(
                `${API_URL}/admin/${orderId}/status`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            status: status
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to update status"
            );

        }


        alert(
            "Order status updated successfully!"
        );


        loadOrders();


    } catch (error) {

        console.error(
            "Status update error:",
            error
        );


        alert(
            "Error: " +
            error.message
        );

    }

}


// =====================================
// START
// =====================================

loadOrders();

</script>


</body>

</html>
